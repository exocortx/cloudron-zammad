name: Build and publish Cloudron image to ghcr.io

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from CloudronManifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' CloudronManifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/arkad-agency/cloudron-zammad:${{ steps.version.outputs.version }}
            ghcr.io/arkad-agency/cloudron-zammad:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update CloudronVersions.json with new image tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="${{ steps.version.outputs.version }}-${SHORT_SHA}"
          jq --arg tag "$IMAGE_TAG" \
             '.versions["${{ steps.version.outputs.version }}"].manifest.dockerImage = "ghcr.io/arkad-agency/cloudron-zammad:" + $tag' \
             CloudronVersions.json > CloudronVersions.json.new
          mv CloudronVersions.json.new CloudronVersions.json
          cat CloudronVersions.json

      - name: Commit updated CloudronVersions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CloudronVersions.json
          git commit -m "ci: update dockerImage tag to ${{ steps.version.outputs.version }}-${SHORT_SHA}" || echo "No changes"
          git push
