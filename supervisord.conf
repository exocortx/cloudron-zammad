; Zammad supervisord config for Cloudron single-container mode
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:railsserver]
command=bash -lc "cd /opt/zammad && RAILS_ENV=production POSTGRESQL_HOST=$CLOUDRON_POSTGRESQL_HOST POSTGRESQL_PORT=$CLOUDRON_POSTGRESQL_PORT POSTGRESQL_USER=$CLOUDRON_POSTGRESQL_USERNAME POSTGRESQL_PASS=$CLOUDRON_POSTGRESQL_PASSWORD POSTGRESQL_DB=$CLOUDRON_POSTGRESQL_DATABASE REDIS_URL=redis://$CLOUDRON_REDIS_HOST:$CLOUDRON_REDIS_PORT MEMCACHE_SERVERS=127.0.0.1:11211 NGINX_PORT=8080 bundle exec rails s -b 127.0.0.1 -p 3000 -e production"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websocket]
command=bash -lc "cd /opt/zammad && RAILS_ENV=production POSTGRESQL_HOST=$CLOUDRON_POSTGRESQL_HOST POSTGRESQL_PORT=$CLOUDRON_POSTGRESQL_PORT POSTGRESQL_USER=$CLOUDRON_POSTGRESQL_USERNAME POSTGRESQL_PASS=$CLOUDRON_POSTGRESQL_PASSWORD POSTGRESQL_DB=$CLOUDRON_POSTGRESQL_DATABASE REDIS_URL=redis://$CLOUDRON_REDIS_HOST:$CLOUDRON_REDIS_PORT bundle exec script/websocket-server.rb -b 127.0.0.1 -p 6042"
autostart=true
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=bash -lc "cd /opt/zammad && RAILS_ENV=production POSTGRESQL_HOST=$CLOUDRON_POSTGRESQL_HOST POSTGRESQL_PORT=$CLOUDRON_POSTGRESQL_PORT POSTGRESQL_USER=$CLOUDRON_POSTGRESQL_USERNAME POSTGRESQL_PASS=$CLOUDRON_POSTGRESQL_PASSWORD POSTGRESQL_DB=$CLOUDRON_POSTGRESQL_DATABASE REDIS_URL=redis://$CLOUDRON_REDIS_HOST:$CLOUDRON_REDIS_PORT bundle exec script/scheduler.rb"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:memcached]
command=/usr/bin/memcached -m 256 -p 11211 -u memcache -l 127.0.0.1
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[group:zammad]
programs=nginx,railsserver,websocket,scheduler,memcached
