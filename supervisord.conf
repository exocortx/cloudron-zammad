; Zammad supervisord config for Cloudron single-container mode
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; PostgreSQL TCP proxy: forwards localhost:5432 to the Cloudron PostgreSQL
; addon service. This is needed because the pg gem's source IP (the docker
; bridge gateway) is rejected by Cloudron's pg_hba.conf, but connections
; from 127.0.0.1 are always accepted (trust on localhost).
; The actual host is passed via PG_PROXY_TARGET env var set in start.sh.
[program:pg-proxy]
command=/bin/sh -c "exec socat TCP-LISTEN:5432,reuseaddr,fork,bind=127.0.0.1 TCP:${PG_PROXY_TARGET}"
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:memcached]
command=/usr/bin/memcached -m 256 -p 11211 -u memcache -l 127.0.0.1
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Zammad first-boot init: waits for postgres/redis, then creates DB, runs
; migrations, seeds data, and sets FQDN. Only runs once (gated by .initialized
; file in the wrapper script itself).
[program:zammad-init]
command=/app/code/zammad-init-wrapper.sh
autostart=true
autorestart=false
priority=8
startsecs=10
startretries=3
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:zammad-nginx]
command=/opt/zammad/bin/docker-entrypoint zammad-nginx
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:zammad-railsserver]
command=/opt/zammad/bin/docker-entrypoint zammad-railsserver
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:zammad-websocket]
command=/opt/zammad/bin/docker-entrypoint zammad-websocket
autostart=true
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:zammad-scheduler]
command=/opt/zammad/bin/docker-entrypoint zammad-scheduler
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[group:zammad]
programs=memcached,zammad-nginx,zammad-railsserver,zammad-websocket,zammad-scheduler