; Cloudron process supervisor for Zammad.
;
; Only the long-running services are supervised here. `zammad-init` is a
; one-shot task run synchronously by start.sh before supervisord starts, and
; `zammad-backup` is not used: Cloudron already backs up /app/data and the
; PostgreSQL/Redis addons as part of the platform's own backup mechanism.

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:zammad-railsserver]
command=/opt/zammad/bin/docker-entrypoint zammad-railsserver
directory=/opt/zammad
user=zammad
environment=HOME="/tmp"
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:zammad-websocket]
command=/opt/zammad/bin/docker-entrypoint zammad-websocket
directory=/opt/zammad
user=zammad
environment=HOME="/tmp"
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:zammad-scheduler]
command=/opt/zammad/bin/docker-entrypoint zammad-scheduler
directory=/opt/zammad
user=zammad
environment=HOME="/tmp"
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:zammad-nginx]
; Runs as root (unlike the other programs): nginx's error_log/access_log are
; set to /dev/stdout by the upstream image, and that stream is only writable
; by the container's initial user (root, since start.sh/supervisord run as
; root). This matches Cloudron's own documented nginx+supervisor example.
command=/opt/zammad/bin/docker-entrypoint zammad-nginx
directory=/opt/zammad
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0